<script>
const SUPABASE_URL = 'https://pklnnihgqjbkytdfgvwr.supabase.co';

async function api(method, path, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers:{
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': method==='POST' ? 'return=representation' : 'return=representation'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){ const e=await res.text(); throw new Error(e); }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

let currentCandidateId = null;
let currentCandidate = null;

function showToast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'), 2000);
}

function initials(n){const p=n.trim().split(/\s+/);return p.length>=2?p[0].slice(-1)+p[1].slice(0,1):n.slice(0,2);}
function fmtDate(d){if(!d)return'';const dt=new Date(d);return`${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;}

function showScreen(id, mode){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if(id==='screen-list') loadCandidates();
  if(id==='screen-detail') loadDetail();
  if(id==='screen-new-candidate' && mode==='new') resetCandidateForm();
  if(id==='screen-new-record' && mode==='new') resetRecordForm();
}

async function loadCandidates(){
  const el = document.getElementById('candidates-list');
  el.innerHTML = '<div class="loading"><span class="spinner"></span>読み込み中...</div>';
  try {
    const candidates = await api('GET', 'candidates?select=*,records(id)&order=created_at.asc');
    document.getElementById('candidate-count').textContent = `${candidates.length}名登録中`;
    if(!candidates.length){
      el.innerHTML='<div class="empty-state"><i class="ti ti-heart" style="font-size:28px;display:block;margin:0 auto 10px;color:var(--pk3)"></i>候補者がまだ登録されていません</div>';
      return;
    }
    el.innerHTML = candidates.map(c=>`
      <div class="candidate-card" onclick="openCandidate(${c.id})">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="avatar">${initials(c.name)}</div>
            <div>
              <div class="card-name">${c.name}</div>
              <div class="card-meta"><i class="ti ti-building-store" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>${c.store}　<i class="ti ti-user" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>${c.supporter}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:7px;">
            <span class="badge-count"><i class="ti ti-file-text" style="font-size:11px;vertical-align:-1px;margin-right:2px"></i>${(c.records||[]).length}回</span>
            <i class="ti ti-chevron-right" style="font-size:15px;color:var(--text3)"></i>
          </div>
        </div>
      </div>`).join('');
  } catch(e){
    el.innerHTML='<div class="empty-state">データの取得に失敗しました</div>';
    showToast('読み込みエラー', 'error');
  }
}

async function openCandidate(id){
  currentCandidateId = id;
  showScreen('screen-detail');
}

async function loadDetail(){
  const el = document.getElementById('records-list');
  el.innerHTML = '<div class="loading"><span class="spinner"></span>読み込み中...</div>';
  try {
    const candidates = await api('GET', `candidates?id=eq.${currentCandidateId}&select=*`);
    currentCandidate = candidates[0];
    if(!currentCandidate) return;
    document.getElementById('detail-avatar').textContent = initials(currentCandidate.name);
    document.getElementById('detail-name').textContent = currentCandidate.name;
    document.getElementById('detail-meta').innerHTML = `<i class="ti ti-building-store" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>${currentCandidate.store}　<i class="ti ti-user" style="font-size:11px;vertical-align:-1px;margin-right:3px"></i>${currentCandidate.supporter}`;

    const records = await api('GET', `records?candidate_id=eq.${currentCandidateId}&order=date.desc`);
    if(!records.length){
      el.innerHTML='<div class="empty-state">面談記録がまだありません</div>';
      return;
    }
    el.innerHTML = records.map(r=>`
      <div class="record-item">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
          <span class="record-date-chip"><i class="ti ti-calendar" style="font-size:11px"></i>${fmtDate(r.date)}</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="record-by-chip">${r.supporter}</span>
            <button class="icon-btn" onclick="editRecord(${r.id})" title="編集"><i class="ti ti-edit"></i></button>
          </div>
        </div>
        <div class="record-label">現在の課題・感じていること</div>
        <div class="record-text">${r.issues||'—'}</div>
        <div class="record-label">課題に対する行動・意識したこと</div>
        <div class="record-text">${r.actions||'—'}</div>
        <div class="record-label">店舗内の変化</div>
        <div class="record-text">${r.changes||'—'}</div>
        ${r.notes?`<div class="record-label">その他</div><div class="record-text">${r.notes}</div>`:''}
        <div class="record-label" style="color:var(--lv4);margin-top:14px;border-top:1px solid var(--lv1);padding-top:10px;">支援部所感</div>
        <div class="record-text">${r.impression||'—'}</div>
      </div>`).join('');
  } catch(e){
    el.innerHTML='<div class="empty-state">データの取得に失敗しました</div>';
    showToast('読み込みエラー', 'error');
  }
}

function selectChip(prefix, el, val){
  document.querySelectorAll(`#${prefix}-chips .chip`).forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById(`${prefix}-supporter`).value = val;
}
function setChipValue(prefix, val){
  document.querySelectorAll(`#${prefix}-chips .chip`).forEach(c=>c.classList.toggle('selected', c.textContent===val));
  document.getElementById(`${prefix}-supporter`).value = val;
}

function resetCandidateForm(){
  document.getElementById('nc-title').textContent='候補者を登録';
  document.getElementById('nc-sub').textContent='基本情報を入力してください';
  document.getElementById('nc-store').value='';
  document.getElementById('nc-name').value='';
  document.getElementById('nc-supporter').value='';
  document.getElementById('nc-edit-id').value='';
  document.getElementById('nc-save-btn').textContent='登録する';
  document.getElementById('nc-delete-btn').style.display='none';
  document.querySelectorAll('#nc-chips .chip').forEach(c=>c.classList.remove('selected'));
}

function editCandidate(){
  if(!currentCandidate) return;
  document.getElementById('nc-title').textContent='候補者情報を編集';
  document.getElementById('nc-sub').textContent='情報を更新してください';
  document.getElementById('nc-store').value = currentCandidate.store;
  document.getElementById('nc-name').value = currentCandidate.name;
  document.getElementById('nc-edit-id').value = currentCandidate.id;
  document.getElementById('nc-save-btn').textContent='更新する';
  document.getElementById('nc-delete-btn').style.display='inline-flex';
  setChipValue('nc', currentCandidate.supporter);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-new-candidate').classList.add('active');
  window.scrollTo(0,0);
}

async function saveCandidate(){
  const store = document.getElementById('nc-store').value.trim();
  const name = document.getElementById('nc-name').value.trim();
  const supporter = document.getElementById('nc-supporter').value;
  const editId = document.getElementById('nc-edit-id').value;
  if(!store||!name||!supporter){alert('店舗名・氏名・担当支援部をすべて入力してください');return;}
  const btn = document.getElementById('nc-save-btn');
  btn.disabled = true;
  try {
    if(editId){
      await api('PATCH', `candidates?id=eq.${editId}`, {store,name,supporter});
      showToast('更新しました');
      showScreen('screen-detail');
    } else {
      await api('POST', 'candidates', {store,name,supporter});
      showToast('登録しました');
      showScreen('screen-list');
    }
  } catch(e){
    showToast('保存に失敗しました', 'error');
  } finally {
    btn.disabled = false;
  }
}

async function deleteCandidate(){
  const editId = document.getElementById('nc-edit-id').value;
  if(!editId) return;
  if(!confirm('この候補者と全ての面談記録を削除しますか？')) return;
  try {
    await api('DELETE', `candidates?id=eq.${editId}`);
    showToast('削除しました');
    showScreen('screen-list');
  } catch(e){
    showToast('削除に失敗しました', 'error');
  }
}

function resetRecordForm(){
  document.getElementById('nr-title').textContent='面談記録を追加';
  if(currentCandidate) document.getElementById('nr-candidate-label').textContent=`${currentCandidate.store}　${currentCandidate.name}`;
  document.getElementById('nr-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('nr-supporter').value='';
  document.getElementById('nr-edit-id').value='';
  document.getElementById('nr-issues').value='';
  document.getElementById('nr-actions').value='';
  document.getElementById('nr-changes').value='';
  document.getElementById('nr-notes').value='';
  document.getElementById('nr-impression').value='';
  document.getElementById('nr-save-btn').textContent='記録を保存';
  document.getElementById('nr-delete-btn').style.display='none';
  document.querySelectorAll('#nr-chips .chip').forEach(c=>c.classList.remove('selected'));
}

async function editRecord(recordId){
  try {
    const records = await api('GET', `records?id=eq.${recordId}&select=*`);
    const r = records[0];
    if(!r) return;
    document.getElementById('nr-title').textContent='面談記録を編集';
    if(currentCandidate) document.getElementById('nr-candidate-label').textContent=`${currentCandidate.store}　${currentCandidate.name}`;
    document.getElementById('nr-date').value = r.date;
    document.getElementById('nr-edit-id').value = r.id;
    document.getElementById('nr-issues').value = r.issues||'';
    document.getElementById('nr-actions').value = r.actions||'';
    document.getElementById('nr-changes').value = r.changes||'';
    document.getElementById('nr-notes').value = r.notes||'';
    document.getElementById('nr-impression').value = r.impression||'';
    document.getElementById('nr-save-btn').textContent='更新する';
    document.getElementById('nr-delete-btn').style.display='inline-flex';
    setChipValue('nr', r.supporter);
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-new-record').classList.add('active');
    window.scrollTo(0,0);
  } catch(e){
    showToast('読み込みエラー', 'error');
  }
}

async function saveRecord(){
  const date = document.getElementById('nr-date').value;
  const supporter = document.getElementById('nr-supporter').value;
  const issues = document.getElementById('nr-issues').value.trim();
  const actions = document.getElementById('nr-actions').value.trim();
  const changes = document.getElementById('nr-changes').value.trim();
  const notes = document.getElementById('nr-notes').value.trim();
  const impression = document.getElementById('nr-impression').value.trim();
  const editId = document.getElementById('nr-edit-id').value;
  if(!date||!supporter){alert('面談日と担当支援部を入力してください');return;}
  const btn = document.getElementById('nr-save-btn');
  btn.disabled = true;
  try {
    if(editId){
      await api('PATCH', `records?id=eq.${editId}`, {date,supporter,issues,actions,changes,notes,impression});
      showToast('更新しました');
    } else {
      await api('POST', 'records', {candidate_id:currentCandidateId, date,supporter,issues,actions,changes,notes,impression});
      showToast('保存しました');
    }
    showScreen('screen-detail');
  } catch(e){
    showToast('保存に失敗しました', 'error');
  } finally {
    btn.disabled = false;
  }
}

async function deleteRecord(){
  const editId = document.getElementById('nr-edit-id').value;
  if(!editId) return;
  if(!confirm('この面談記録を削除しますか？')) return;
  try {
    await api('DELETE', `records?id=eq.${editId}`);
    showToast('削除しました');
    showScreen('screen-detail');
  } catch(e){
    showToast('削除に失敗しました', 'error');
  }
}

loadCandidates();
</script>
