<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チーフ候補者管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pk1:#FDF0F5;--pk2:#F9D6E8;--pk3:#F0A8C8;--pk4:#D4679A;--pk5:#A8457A;
  --lv1:#F3F0FB;--lv2:#DDD6F5;--lv3:#B8ABEC;--lv4:#7B6DD4;--lv5:#5146A8;
  --text1:#3D2B3D;--text2:#7A5A7A;--text3:#B090B0;
  --bg:#FDFAFD;--card:#FFFFFF;
  --radius:14px;--radius-sm:9px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;}
.container{max-width:680px;margin:0 auto;padding:2rem 1.25rem;}
.screen{display:none;}.screen.active{display:block;}
.hero-bar{background:linear-gradient(135deg,#F9D6E8 0%,#DDD6F5 100%);border-radius:var(--radius);padding:20px 22px;margin-bottom:1.5rem;}
.hero-title{font-size:18px;font-weight:600;color:var(--pk5);letter-spacing:0.02em;}
.hero-sub{font-size:12px;color:var(--lv4);margin-top:4px;}
.page-title{font-size:17px;font-weight:600;color:var(--text1);margin-bottom:3px;}
.page-sub{font-size:12px;color:var(--text2);margin-bottom:1.5rem;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;letter-spacing:0.04em;font-weight:500;}
.field input,.field select{width:100%;background:var(--lv1);border:1px solid var(--lv2);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--text1);outline:none;font-family:inherit;}
.field input:focus,.field select:focus{border-color:var(--lv3);}
.field textarea{width:100%;min-height:85px;resize:vertical;font-size:13px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--lv2);background:var(--lv1);color:var(--text1);line-height:1.6;outline:none;font-family:inherit;}
.field textarea:focus{border-color:var(--lv3);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-primary{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:10px 22px;border-radius:99px;border:none;background:linear-gradient(135deg,var(--pk3),var(--lv3));color:#fff;cursor:pointer;font-weight:500;font-family:inherit;}
.btn-primary:hover{opacity:0.88;}.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:10px 22px;border-radius:99px;border:1.5px solid var(--lv2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;}
.btn-ghost:hover{background:var(--lv1);}
.btn-danger{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:10px 16px;border-radius:99px;border:1.5px solid var(--pk2);background:transparent;color:var(--pk4);cursor:pointer;font-family:inherit;}
.btn-danger:hover{background:var(--pk1);}
.candidate-card{background:var(--card);border:1px solid var(--lv2);border-radius:var(--radius);padding:15px 18px;margin-bottom:10px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;}
.candidate-card:hover{border-color:var(--lv3);box-shadow:0 2px 14px rgba(180,140,210,0.13);}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pk2),var(--lv2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--pk5);flex-shrink:0;border:1.5px solid var(--pk2);}
.card-name{font-size:14px;font-weight:600;color:var(--text1);}
.card-meta{font-size:11px;color:var(--text2);margin-top:3px;}
.badge-count{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--lv1);color:var(--lv4);border:1px solid var(--lv2);}
.record-item{border:1px solid var(--lv2);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;background:var(--card);}
.record-date-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--pk5);background:var(--pk1);border:1px solid var(--pk2);border-radius:99px;padding:4px 13px;}
.record-by-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--lv4);background:var(--lv1);border-radius:99px;padding:4px 10px;border:1px solid var(--lv2);}
.record-label{font-size:10px;color:var(--text3);letter-spacing:0.05em;margin-bottom:4px;margin-top:12px;font-weight:500;}
.record-text{font-size:13px;color:var(--text1);line-height:1.65;white-space:pre-wrap;}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:13px;}
.nav-back{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text2);cursor:pointer;margin-bottom:1rem;padding:4px 0;background:none;border:none;font-family:inherit;}
.nav-back:hover{color:var(--text1);}
.chip{font-size:12px;padding:7px 15px;border-radius:99px;border:1.5px solid var(--lv2);cursor:pointer;color:var(--text2);background:transparent;transition:all 0.15s;font-family:inherit;}
.chip.selected{background:linear-gradient(135deg,var(--pk1),var(--lv1));color:var(--pk5);border-color:var(--pk3);}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:5px 7px;border-radius:var(--radius-sm);font-size:15px;display:inline-flex;align-items:center;font-family:inherit;}
.icon-btn:hover{color:var(--lv4);background:var(--lv1);}
.section-heading{font-size:13px;font-weight:600;color:var(--text1);margin-bottom:10px;}
.toast{position:fixed;bottom:24px;right:24px;font-size:12px;padding:8px 18px;border-radius:99px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;}
.toast.success{background:linear-gradient(135deg,var(--pk3),var(--lv3));color:#fff;}
.toast.error{background:#E24B4A;color:#fff;}
.toast.show{opacity:1;}
.loading{text-align:center;padding:2rem;color:var(--text3);font-size:13px;}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--lv2);border-top-color:var(--lv3);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:-4px;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.tab-btn{flex:1;padding:10px;font-size:13px;border:none;background:transparent;cursor:pointer;color:var(--text3);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;font-family:inherit;font-weight:500;}
.tab-btn.active{color:var(--pk5);font-weight:600;border-bottom-color:var(--pk4);}
.star-row{display:flex;gap:4px;align-items:center;}
.star{font-size:20px;cursor:pointer;color:var(--lv2);transition:color 0.1s;line-height:1;}
.star.on{color:#F0A8C8;}
.eval-item{border:1px solid var(--lv2);border-radius:var(--radius);padding:15px 18px;margin-bottom:10px;background:var(--card);}
.eval-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--lv1);}
.eval-row:last-child{border-bottom:none;}
.eval-label{font-size:12px;color:var(--text2);}
.stars-display{display:flex;gap:3px;}
.star-d{font-size:16px;color:var(--lv2);}
.star-d.on{color:#F0A8C8;}
</style>
</head>
<body>
<div class="container">

<div class="screen active" id="screen-list">
  <div class="hero-bar">
    <div class="hero-title">チーフ候補者管理</div>
    <div class="hero-sub" id="candidate-count">読み込み中...</div>
  </div>
  <div style="display:flex;border-bottom:1.5px solid var(--lv2);margin-bottom:1rem;">
    <button class="tab-btn active" id="ftab-all" onclick="setFilter('all',this)">すべて</button>
    <button class="tab-btn" id="ftab-秋定" onclick="setFilter('秋定',this)">秋定</button>
    <button class="tab-btn" id="ftab-林" onclick="setFilter('林',this)">林</button>
    <button class="tab-btn" id="ftab-三尾" onclick="setFilter('三尾',this)">三尾</button>
    <button class="tab-btn" id="ftab-岩下" onclick="setFilter('岩下',this)">岩下</button>
    <button class="tab-btn" id="ftab-佐藤" onclick="setFilter('佐藤',this)">佐藤</button>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:0.75rem;">
    <button class="btn-primary" onclick="showScreen('screen-new-candidate','new')"><i class="ti ti-plus"></i>候補者を登録</button>
  </div>
  <div id="candidates-list"><div class="loading"><span class="spinner"></span>データを取得中...</div></div>
</div>

<div class="screen" id="screen-new-candidate">
  <button class="nav-back" onclick="showScreen('screen-list')"><i class="ti ti-arrow-left"></i>一覧に戻る</button>
  <div class="page-title" id="nc-title">候補者を登録</div>
  <div class="page-sub" id="nc-sub">基本情報を入力してください</div>
  <div class="row2">
    <div class="field"><label>店舗名</label><input type="text" id="nc-store" placeholder="例：渋谷店"></div>
    <div class="field"><label>氏名</label><input type="text" id="nc-name" placeholder="例：田中 さくら"></div>
  </div>
  <div class="field">
    <label>担当支援部</label>
    <div class="chips" id="nc-chips">
      <button class="chip" onclick="selectChip('nc',this,'秋定')">秋定</button>
      <button class="chip" onclick="selectChip('nc',this,'林')">林</button>
      <button class="chip" onclick="selectChip('nc',this,'三尾')">三尾</button>
      <button class="chip" onclick="selectChip('nc',this,'岩下')">岩下</button>
      <button class="chip" onclick="selectChip('nc',this,'佐藤')">佐藤</button>
    </div>
    <input type="hidden" id="nc-supporter">
    <input type="hidden" id="nc-edit-id">
  </div>
  <div style="display:flex;gap:8px;margin-top:1.25rem;flex-wrap:wrap;align-items:center;">
    <button class="btn-ghost" onclick="showScreen('screen-list')">キャンセル</button>
    <button class="btn-primary" id="nc-save-btn" onclick="saveCandidate()">登録する</button>
    <button class="btn-danger" id="nc-delete-btn" onclick="deleteCandidate()" style="display:none;margin-left:auto;"><i class="ti ti-trash"></i>削除</button>
  </div>
</div>

<div class="screen" id="screen-detail">
  <button class="nav-back" onclick="showScreen('screen-list')"><i class="ti ti-arrow-left"></i>一覧に戻る</button>
  <div style="background:linear-gradient(135deg,var(--pk1) 0%,var(--lv1) 100%);border-radius:var(--radius);padding:18px 20px;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="avatar" id="detail-avatar"></div>
      <div>
        <div class="card-name" id="detail-name" style="font-size:16px;"></div>
        <div class="card-meta" id="detail-meta"></div>
      </div>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn-ghost" onclick="editCandidate()" style="padding:8px 14px;font-size:12px;"><i class="ti ti-edit"></i>編集</button>
      <button class="btn-primary" id="detail-add-btn" onclick="detailAddClick()" style="padding:8px 14px;font-size:12px;"><i class="ti ti-plus"></i>面談追加</button>
    </div>
  </div>
  <div style="display:flex;border-bottom:1.5px solid var(--lv2);margin-bottom:1.25rem;">
    <button class="tab-btn active" id="tab-records" onclick="switchTab('records')">面談履歴</button>
    <button class="tab-btn" id="tab-evals" onclick="switchTab('evals')">店舗パートナー評価</button>
  </div>
  <div id="tab-records-content">
    <div id="records-list"></div>
  </div>
  <div id="tab-evals-content" style="display:none;">
    <div id="evals-list"></div>
  </div>
</div>

<div class="screen" id="screen-new-record">
  <button class="nav-back" onclick="showScreen('screen-detail')"><i class="ti ti-arrow-left"></i>候補者詳細に戻る</button>
  <div class="page-title" id="nr-title">面談記録を追加</div>
  <div class="page-sub" id="nr-candidate-label"></div>
  <div class="row2">
    <div class="field"><label>面談日</label><input type="date" id="nr-date"></div>
    <div class="field">
      <label>担当支援部</label>
      <div class="chips" id="nr-chips">
        <button class="chip" onclick="selectChip('nr',this,'秋定')">秋定</button>
        <button class="chip" onclick="selectChip('nr',this,'林')">林</button>
        <button class="chip" onclick="selectChip('nr',this,'三尾')">三尾</button>
        <button class="chip" onclick="selectChip('nr',this,'岩下')">岩下</button>
        <button class="chip" onclick="selectChip('nr',this,'佐藤')">佐藤</button>
      </div>
      <input type="hidden" id="nr-supporter">
      <input type="hidden" id="nr-edit-id">
    </div>
  </div>
  <div class="field"><label>① 現在の課題・感じていること</label><textarea id="nr-issues" placeholder="候補者が感じている課題や悩みを記入してください"></textarea></div>
  <div class="field"><label>② 課題に対する行動・意識したこと</label><textarea id="nr-actions" placeholder="課題に対して取り組んでいること、意識していることを記入してください"></textarea></div>
  <div class="field"><label>③ 店舗内の変化</label><textarea id="nr-changes" placeholder="最近の店舗内の変化や気づきを記入してください"></textarea></div>
  <div class="field"><label>④ その他</label><textarea id="nr-notes" placeholder="その他、共有事項や補足があれば記入してください"></textarea></div>
  <div class="field"><label>支援部所感</label><textarea id="nr-impression" placeholder="支援部として感じたこと、今後の方針など"></textarea></div>

  <div style="background:linear-gradient(135deg,var(--pk1),var(--lv1));border-radius:var(--radius);padding:14px 16px;margin:1.25rem 0 1rem;">
    <div style="font-size:13px;font-weight:600;color:var(--pk5);margin-bottom:2px;">チーフ候補者 面談シート</div>
    <div style="font-size:11px;color:var(--text2);">各質問にエピソード・事実ベースで記入してください</div>
  </div>

  <div class="field"><label>面談回数</label><input type="number" id="nr-count" placeholder="例：1" min="1" style="max-width:120px;"></div>

  <div style="font-size:11px;font-weight:600;color:var(--pk5);margin-bottom:8px;margin-top:4px;">① 振り返り（前回面談からの変化・行動確認）※初回は省略</div>
  <div class="field"><label>Q1. 前回「次回までにやる」と決めたこと、実際にできましたか？</label><textarea id="nr-q1" placeholder="エピソード・事実を記入"></textarea></div>
  <div class="field"><label>Q2. やってみてどうでしたか？うまくいったこと・いかなかったことを教えてください。</label><textarea id="nr-q2" placeholder="エピソード・事実を記入"></textarea></div>
  <div class="field"><label>Q3. 店舗やスタッフの様子で、何か変化に気づいたことはありますか？</label><textarea id="nr-q3" placeholder="エピソード・事実を記入"></textarea></div>

  <div style="font-size:11px;font-weight:600;color:var(--pk5);margin-bottom:8px;margin-top:4px;">② 現状確認（3つの評価軸に対するエピソード確認）</div>
  <div class="field"><label>Q4. 最近、誰かに言われる前に自分から気づいて動いた場面はありましたか？（清掃・整備・備品など）<br><span style="color:var(--lv4);">軸①：店舗環境への主体的な関与</span></label><textarea id="nr-q4" placeholder="エピソード・事実を記入"></textarea></div>
  <div class="field"><label>Q5. 困っているスタッフや後輩に、自分から声をかけたり助けに入った場面はありましたか？<br><span style="color:var(--lv4);">軸③：スタッフへの自発的な声掛け・フォロー</span></label><textarea id="nr-q5" placeholder="エピソード・事実を記入"></textarea></div>
  <div class="field"><label>Q6. うまくいかなかった場面で、自分の行動を振り返ったことはありますか？そのときどう考えましたか？<br><span style="color:var(--lv4);">軸④：自責での振り返り</span></label><textarea id="nr-q6" placeholder="エピソード・事実を記入"></textarea></div>

  <div style="font-size:11px;font-weight:600;color:var(--pk5);margin-bottom:8px;margin-top:4px;">③ 課題と行動（自己認識・自責思考の確認）</div>
  <div class="field"><label>Q7. 今、自分が一番できていないと感じていることは何ですか？</label><textarea id="nr-q7" placeholder="エピソード・事実を記入"></textarea></div>
  <div class="field"><label>Q8. それはなぜだと思いますか？</label><textarea id="nr-q8" placeholder="エピソード・事実を記入"></textarea></div>
  <div class="field"><label>Q9. それに対して、今何か意識していることや取り組んでいることはありますか？</label><textarea id="nr-q9" placeholder="エピソード・事実を記入"></textarea></div>

  <div style="font-size:11px;font-weight:600;color:var(--pk5);margin-bottom:8px;margin-top:4px;">④ 次回までの行動（具体的な行動の約束）※最終面談は省略</div>
  <div class="field"><label>Q10. 今日話したことをふまえて、次回の面談までに具体的に取り組むことを一つ決めましょう。</label><textarea id="nr-q10" placeholder="エピソード・事実を記入"></textarea></div>
  <div class="field"><label>Q11. それをいつ・どんな場面でやりますか？</label><textarea id="nr-q11" placeholder="エピソード・事実を記入"></textarea></div>

  <div style="display:flex;gap:8px;margin-top:1.25rem;flex-wrap:wrap;align-items:center;">
    <button class="btn-ghost" onclick="showScreen('screen-detail')">キャンセル</button>
    <button class="btn-primary" id="nr-save-btn" onclick="saveRecord()">記録を保存</button>
    <button class="btn-danger" id="nr-delete-btn" onclick="deleteRecord()" style="display:none;margin-left:auto;"><i class="ti ti-trash"></i>削除</button>
  </div>
</div>

<div class="screen" id="screen-new-eval">
  <button class="nav-back" onclick="showScreen('screen-detail')"><i class="ti ti-arrow-left"></i>候補者詳細に戻る</button>
  <div class="page-title" id="ne-title">パートナー評価を追加</div>
  <div class="page-sub" id="ne-candidate-label"></div>
  <div class="row2">
    <div class="field"><label>評価日</label><input type="date" id="ne-date"></div>
    <div class="field">
      <label>評価者（支援部）</label>
      <div class="chips" id="ne-chips">
        <button class="chip" onclick="selectChip('ne',this,'秋定')">秋定</button>
        <button class="chip" onclick="selectChip('ne',this,'林')">林</button>
        <button class="chip" onclick="selectChip('ne',this,'三尾')">三尾</button>
        <button class="chip" onclick="selectChip('ne',this,'岩下')">岩下</button>
        <button class="chip" onclick="selectChip('ne',this,'佐藤')">佐藤</button>
      </div>
      <input type="hidden" id="ne-supporter">
      <input type="hidden" id="ne-edit-id">
    </div>
  </div>
  <div class="field">
    <label>5S</label>
    <div class="star-row" id="stars-5s">
      <span class="star" onclick="setStar('5s',1)">★</span>
      <span class="star" onclick="setStar('5s',2)">★</span>
      <span class="star" onclick="setStar('5s',3)">★</span>
    </div>
    <input type="hidden" id="ne-5s">
  </div>
  <div class="field">
    <label>コミュニケーション・連携</label>
    <div class="star-row" id="stars-communication">
      <span class="star" onclick="setStar('communication',1)">★</span>
      <span class="star" onclick="setStar('communication',2)">★</span>
      <span class="star" onclick="setStar('communication',3)">★</span>
    </div>
    <input type="hidden" id="ne-communication">
  </div>
  <div class="field">
    <label>フォロー・声掛け</label>
    <div class="star-row" id="stars-followup">
      <span class="star" onclick="setStar('followup',1)">★</span>
      <span class="star" onclick="setStar('followup',2)">★</span>
      <span class="star" onclick="setStar('followup',3)">★</span>
    </div>
    <input type="hidden" id="ne-followup">
  </div>
  <div class="field">
    <label>業務への取り組み・姿勢</label>
    <div class="star-row" id="stars-attitude">
      <span class="star" onclick="setStar('attitude',1)">★</span>
      <span class="star" onclick="setStar('attitude',2)">★</span>
      <span class="star" onclick="setStar('attitude',3)">★</span>
    </div>
    <input type="hidden" id="ne-attitude">
  </div>
  <div class="field"><label>パートナーからの意見・コメント</label><textarea id="ne-partner-comment" placeholder="パートナーから受けた意見や要望などを記入してください"></textarea></div>
  <div style="display:flex;gap:8px;margin-top:1.25rem;flex-wrap:wrap;align-items:center;">
    <button class="btn-ghost" onclick="showScreen('screen-detail')">キャンセル</button>
    <button class="btn-primary" id="ne-save-btn" onclick="saveEval()">評価を保存</button>
    <button class="btn-danger" id="ne-delete-btn" onclick="deleteEval()" style="display:none;margin-left:auto;"><i class="ti ti-trash"></i>削除</button>
  </div>
</div>

</div>

async function api(method, path, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers:{
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: body ? JSON.stringify(body) : undefined
  });

}

  const partner_comment = document.getElementById('ne-partner-comment').value.trim();
  const editId = document.getElementById('ne-edit-id').value;
  if(!date||!evaluator){alert('評価日と評価者を入力してください');return;}
  const btn = document.getElementById('ne-save-btn');btn.disabled=true;
  try {
    if(editId){
      await api('PATCH', `evaluations?id=eq.${editId}`, {date,evaluator,score_5s,score_communication,score_followup,score_attitude,partner_comment});
      showToast('更新しました');
    } else {
      await api('POST', 'evaluations', {candidate_id:currentCandidateId,date,evaluator,score_5s,score_communication,score_followup,score_attitude,partner_comment});
      showToast('保存しました');
    }
    currentTab='evals';
    showScreen('screen-detail');
    setTimeout(()=>switchTab('evals'),300);
  } catch(e){showToast('保存に失敗しました','error');}
  finally{btn.disabled=false;}
}
async function deleteEval(){
  const editId = document.getElementById('ne-edit-id').value;
  if(!editId) return;
  if(!confirm('この評価を削除しますか？')) return;
  try {
    await api('DELETE', `evaluations?id=eq.${editId}`);
    showToast('削除しました');
    currentTab='evals';
    showScreen('screen-detail');
    setTimeout(()=>switchTab('evals'),300);
  } catch(e){showToast('削除に失敗しました','error');}
}

loadCandidates();
</script>
